spring:
  application:
    name: zeta-worker

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /

server:
  # Management-only port: the Worker serves no business traffic.
  port: 8080

management:
  endpoints:
    web:
      exposure:
        # The Worker serves health only. The detection diagnostic endpoint
        # (/actuator/hotkey-worker) is opt-in: add `hotkeyworker` to this include
        # and map `hotkeyworker: hotkey-worker` when an operator explicitly needs
        # the read-only key view. WorkerApplication excludes the App-only actuator
        # auto-configuration, and the empty /actuator/info stays unexposed.
        # Endpoint ids are alphanumeric (Boot 3.5).
        include: health
  endpoint:
    health:
      # Liveness excludes RabbitMQ: a broker outage must not restart a healthy
      # Worker. Readiness includes it, so an instance that cannot consume
      # reports is taken out of service without being killed.
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,rabbit

zeta:
  report:
    enabled: false
  worker:
    enabled: true

    # The default rule for keys nothing else matches: required in full.
    detection:
      defaults:
        hot-qps: 1000
        cool:
          strategy: COOL_FOR_LOW_QPS
          cool-qps: 100
          low-qps-for: 30s

logging:
  level:
    io.github.hyshmily: INFO
