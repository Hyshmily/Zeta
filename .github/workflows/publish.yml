name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build all JARs
        run: mvn clean package -DskipTests --no-transfer-progress

      # README pulls ghcr.io/hyshmily/zeta-worker:<version>; keep the package
      # public so anonymous `docker run` works.
      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Worker image tag
        if: startsWith(github.ref, 'refs/tags/v')
        id: worker-image
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/setup-buildx-action@v3

      - name: Build and push Worker image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: worker
          push: true
          tags: ghcr.io/hyshmily/zeta-worker:${{ steps.worker-image.outputs.tag }}

      - name: Publish parent POM & starter to GitHub Packages
        continue-on-error: true
        run: mvn deploy -pl .,common -P github-packages -DskipTests --no-transfer-progress
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package release assets
        run: |
          VER=${{ github.ref_name }}
          PKDIR="packaging/zeta-worker-${VER}"
          mkdir -p "${PKDIR}/lib"
          mkdir -p "${PKDIR}/docker/target"
          cp worker/target/zeta-worker-*.jar "${PKDIR}/lib/"
          # The shipped Dockerfile copies target/..., so keep a copy next to it;
          # `docker compose up` from docker/ then works without the repo.
          cp worker/target/zeta-worker-*.jar "${PKDIR}/docker/target/"
          cp worker/Dockerfile worker/docker-compose.yml "${PKDIR}/docker/" || true
          cp -r docs "${PKDIR}/"
          cp README.md README.zh.md LICENSE "${PKDIR}/"
          (cd packaging && zip -r "../zeta-worker-${VER}.zip" "zeta-worker-${VER}")
          (cd packaging && tar czf "../zeta-worker-${VER}.tar.gz" "zeta-worker-${VER}")

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: Zeta ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            common/target/zeta-*.jar
            common/target/zeta-*-sources.jar
            common/target/zeta-*-javadoc.jar
            worker/target/zeta-worker-*.jar
            zeta-worker-*.zip
            zeta-worker-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
