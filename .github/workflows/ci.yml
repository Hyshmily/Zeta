name: CI
on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven
      - name: Compile
        run: mvn clean compile --no-transfer-progress

  test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven
      - name: Run tests with coverage check
        # flaky/performance-tagged tests are excluded via zeta.surefire.excludedGroups
        # (wired into the module surefire configs); surefire's own -DexcludedGroups user
        # property cannot override pom-wired configuration, so it is not passed here.
        run: mvn clean verify --no-transfer-progress
      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: |
            common/target/site/jacoco/
            worker/target/site/jacoco/
          retention-days: 14
      - name: Upload common coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: common/target/site/jacoco/jacoco.xml
          base-path: common/src/main/java
          flag-name: common
          parallel: true
      - name: Upload worker coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: worker/target/site/jacoco/jacoco.xml
          base-path: worker/src/main/java
          flag-name: worker
          parallel: true

  finish:
    name: Coveralls Parallel Finish
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true
          carryforward: "common,worker"


